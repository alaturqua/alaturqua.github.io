<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #151514; --ink: #ecebe6; --ink-2: #bdbcb6; --rule: #2f2f2c; --signal: #f06a2f; color-scheme: dark; } }
  :root[data-theme="dark"] { --paper: #151514; --ink: #ecebe6; --ink-2: #bdbcb6; --rule: #2f2f2c; --signal: #f06a2f; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; background: var(--paper); color: var(--ink); font: 17px/1.55 "Hanken Grotesk", system-ui, sans-serif; }
  main { max-width: 34rem; }
  img { display: block; width: 56px; height: 56px; margin-bottom: 32px; }
  .code { font-variant-numeric: tabular-nums; color: var(--signal); font-weight: 600; letter-spacing: .04em; }
  h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.05; letter-spacing: -.02em; margin: 8px 0 16px; font-weight: 600; }
  p { color: var(--ink-2); margin: 0 0 28px; }

</style>
</head>
